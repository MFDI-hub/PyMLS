[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rfc9420"
version = "1.4.5"
description = "Messaging Layer Security (MLS) protocol implementation (RFC 9420) in Python"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "mfdi" }]
keywords = ["mls", "messaging layer security", "rfc9420", "cryptography", "hpke"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 3 - Alpha",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "cryptography>=42",
  "certifi>=2024.7.4",
  "rfc9180>=0.4.0",
]

[project.optional-dependencies]
sqlite = [
  "aiosqlite>=0.19",
]
dev = [
  "python-dotenv>=1.0.0",
  "pytest>=8",
  "ruff>=0.6",
  "ty>=0.0.74",
  "tomli>=2.0.0",
  "aiosqlite>=0.19",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
]

[project.scripts]
rfc9420-interop = "src.rfc9420.interop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rfc9420"]

[dependency-groups]
dev = [
  "python-dotenv>=1.0.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "ty>=0.0.74",
  "tomli>=2.0.0",
]
sqlite = [
  "aiosqlite>=0.19",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ty.environment]
# Use Optional[] / Union[] for Python 3.9 compatibility (no PEP 604 X|Y at runtime).
python-version = "3.9"

[tool.ty.rules]
unused-ignore-comment = "warn"
redundant-cast = "warn"

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]