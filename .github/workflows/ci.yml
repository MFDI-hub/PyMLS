name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pipx install uv
      - name: Sync dependencies
        run: uv sync --dev --group sqlite
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run ty check src
      - name: Fetch official MLS test vectors
        run: |
          # Pin the suite that this tree was verified against. A floating
          # main checkout can change the vectors without a change here.
          git clone --filter=blob:none --sparse https://github.com/mlswg/mls-implementations.git mls-implementations
          git -C mls-implementations sparse-checkout set test-vectors
          git -C mls-implementations fetch --depth 1 origin bcbb4d4736fb7591ad8390346fb8e45a61a9e53e
          git -C mls-implementations checkout --detach bcbb4d4736fb7591ad8390346fb8e45a61a9e53e
      - name: Test
        run: uv run pytest -q
